name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}

      # The npm trusted publisher only allows staging: the version is uploaded
      # with provenance and goes live after a maintainer approves it with 2FA
      # (`npm stage list design-system-axi`, then `npm stage approve <stage-id>`).
      - run: npm stage publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
