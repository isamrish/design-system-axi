name: release-please

on:
  push:
    branches: [main]
  # Recovery path: publish an existing release tag whose automatic publish did
  # not complete (Actions → release-please → Run workflow → enter the tag).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. design-system-axi-v0.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The npm trusted publisher for design-system-axi is bound to this workflow
  # file (release-please.yml), so publishing must stay in this file.
  publish:
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^design-system-axi-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a design-system-axi release tag (design-system-axi-vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag matches package.json and is not yet published
        id: check
        run: |
          version="${TAG#design-system-axi-v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package_version" ]; then
            echo "::error::tag $TAG does not match package.json version $package_version"
            exit 1
          fi
          if npm view "design-system-axi@$version" version >/dev/null 2>&1; then
            echo "::notice::design-system-axi@$version is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip != 'true'

      - run: pnpm run build
        if: steps.check.outputs.skip != 'true'

      # npm tries OIDC trusted publishing first and falls back to NODE_AUTH_TOKEN
      # only if the token exchange fails. The NPM_TOKEN fallback exists because
      # the exchange is rejected for this repository (npm/cli#9969); delete the
      # secret once OIDC publishing works.
      - run: npm publish --access public --provenance
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
